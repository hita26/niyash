name: Auto Deploy to GoDaddy cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Live Server via SCP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy build to GoDaddy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          source: "frontend/dist/**,frontend/dist/.htaccess"
          target: "public_html"
          strip_components: 2
          overwrite: true

      - name: Verify Live Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          script: |
            cd ~/public_html
            echo "=== Live index.html check ==="
            grep "index-" index.html || true
            echo "=== Deployment to niyanshpharma.com completed successfully ==="
