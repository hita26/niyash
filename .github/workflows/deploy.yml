name: Auto Deploy to GoDaddy cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Live Server via Native SSH/SCP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH and Push Dist to GoDaddy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          eval $(ssh-agent -s)
          printf '%s\n' "$SSH_PASSPHRASE" | ssh-add - <<< "$SSH_KEY"
          ssh-keyscan -H -p 22 "$SSH_HOST" >> ~/.ssh/known_hosts
          
          echo "Syncing frontend/dist to ~/public_html on GoDaddy..."
          if rsync -avz frontend/dist/ "$SSH_USER@$SSH_HOST:public_html/"; then
            echo "Rsync transfer successful!"
          else
            echo "Rsync unavailable, falling back to standard SCP..."
            scp -r frontend/dist/* "$SSH_USER@$SSH_HOST:public_html/"
            scp frontend/dist/.htaccess "$SSH_USER@$SSH_HOST:public_html/" || true
          fi

          echo "Verifying deployment on live server..."
          ssh "$SSH_USER@$SSH_HOST" "cd ~/public_html && echo 'Live index.html JS bundle:' && grep 'index-' index.html"
          echo "Deployment to niyanshpharma.com finished successfully!"
